<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egonaut</title>
    
    <!-- Fehler-Handler (Global) -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            if(msg && (msg.includes('ResizeObserver') || msg.includes('Script error'))) return;
            
            const root = document.getElementById('root');
            if(root) {
                const errDiv = document.createElement('div');
                errDiv.innerHTML = `
                    <div style="position:fixed; bottom:0; left:0; right:0; background: #fee2e2; padding: 10px; font-family: sans-serif; border-top: 2px solid #f87171; color: #991b1b; z-index:9999;">
                        <b>Fehler:</b> ${msg} (Zeile ${line})
                        <br><span style="font-size:0.8em">Falls "BLOCKED": Bitte AdBlocker deaktivieren.</span>
                    </div>
                `;
                document.body.appendChild(errDiv);
            }
            return false;
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // Firebase global verfügbar machen
        window.Firebase = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp };
        window.firebaseReady = true;
    </script>

    <style>
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.3); border-radius: 20px; }
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); border-left-color: #4f46e5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- DEINE FEST EINGEBAUTE CONFIG (EGONAUT) ---
    const YOUR_FIREBASE_CONFIG = {
        apiKey: "AIzaSyDQCFzeT6rKoYeOTGQLNuFNsFgcbAbqJmQ",
        authDomain: "egonaut-f8f0c.firebaseapp.com",
        projectId: "egonaut-f8f0c",
        storageBucket: "egonaut-f8f0c.firebasestorage.app",
        messagingSenderId: "432139432404",
        appId: "1:432139432404:web:ab39c80b155720148ca641",
        measurementId: "G-3N9MNHTPER"
    };

    // --- ICONS ---
    const Icons = {
        Play: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
        Pause: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
        RotateCcw: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>,
        Check: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
        Plus: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
        Trash2: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
        AlertCircle: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
        Clock: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
        Settings: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
        Cloud: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
    };

    const App = () => {
        const [config, setConfig] = useState(YOUR_FIREBASE_CONFIG);
        const [connected, setConnected] = useState(false);
        const [tasks, setTasks] = useState([]);
        const [loading, setLoading] = useState(true);
        const [initError, setInitError] = useState(null);
        const [slowLoading, setSlowLoading] = useState(false);
        
        // Timer & UI State
        const [newTaskTitle, setNewTaskTitle] = useState('');
        const [isUrgent, setIsUrgent] = useState(false);
        const [isImportant, setIsImportant] = useState(true);
        const [pomoEst, setPomoEst] = useState(1);
        const [activeTaskId, setActiveTaskId] = useState(null);
        const [timeLeft, setTimeLeft] = useState(25 * 60);
        const [isRunning, setIsRunning] = useState(false);
        const [isBreak, setIsBreak] = useState(false);
        const [newSubtaskTitle, setNewSubtaskTitle] = useState('');
        
        const dbRef = useRef(null);
        const authRef = useRef(null);
        const timerRef = useRef(null);
        const unsubscribeRef = useRef(null);

        // 1. Firebase initialisieren - OPTIMIERT
        useEffect(() => {
            if (!config) return;
            setLoading(true);

            // Timeout-Warner - etwas später
            const timeoutId = setTimeout(() => setSlowLoading(true), 5000);

            const init = async () => {
                try {
                    // Warte auf Firebase SDK - aber mit kürzerem Timeout
                    let attempts = 0;
                    while (!window.firebaseReady && attempts < 30) {
                        await new Promise(r => setTimeout(r, 50));
                        attempts++;
                    }
                    if (!window.Firebase) throw new Error("Firebase SDK konnte nicht geladen werden");

                    const { initializeApp, getAuth, getFirestore, signInAnonymously, onAuthStateChanged } = window.Firebase;
                    
                    let app;
                    try { 
                        app = initializeApp(config); 
                    } catch (e) { 
                        if (e.code === 'app/duplicate-app') {
                            // App bereits initialisiert, hole sie
                            const { getApp } = await import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js");
                            app = getApp();
                        } else {
                            app = initializeApp(config, "Secondary" + Date.now()); 
                        }
                    }

                    authRef.current = getAuth(app);
                    dbRef.current = getFirestore(app);

                    // Warte auf Auth State BEVOR wir fortfahren
                    await new Promise((resolve, reject) => {
                        const unsubscribe = onAuthStateChanged(authRef.current, async (user) => {
                            unsubscribe();
                            if (user) {
                                console.log("Authentifiziert:", user.uid);
                                setConnected(true);
                                resolve();
                            } else {
                                // Noch nicht angemeldet, melde anonym an
                                try {
                                    await signInAnonymously(authRef.current);
                                    console.log("Anonym angemeldet");
                                    setConnected(true);
                                    resolve();
                                } catch (authError) {
                                    reject(authError);
                                }
                            }
                        }, reject);
                    });

                    // Jetzt laden wir die Tasks
                    loadTasks();

                } catch (e) {
                    console.error("Init Fehler:", e);
                    let msg = "Start-Fehler: " + e.message;
                    if(e.code === 'auth/configuration-not-found') msg = "SETUP FEHLT: Bitte 'Anonymen Login' in Firebase aktivieren!";
                    if(e.code === 'permission-denied') msg = "Zugriff verweigert - Firebase Regeln prüfen!";
                    setInitError(msg);
                    setLoading(false);
                } finally {
                    clearTimeout(timeoutId);
                }
            };
            init();
            
            return () => {
                clearTimeout(timeoutId);
                if (unsubscribeRef.current) {
                    unsubscribeRef.current();
                }
            };
        }, [config]);

        // Laden aus GLOBALEM Pfad 'tasks' statt 'users/{id}/tasks'
        const loadTasks = () => {
            if (!dbRef.current) return;
            const { collection, query, onSnapshot } = window.Firebase;
            
            // Laden aus einer globalen Collection 'tasks'
            const q = query(collection(dbRef.current, 'tasks'));
            
            unsubscribeRef.current = onSnapshot(q, (snapshot) => {
                const loaded = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                loaded.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
                setTasks(loaded);
                setLoading(false);
                setSlowLoading(false);
            }, (err) => {
                console.error("Ladefehler:", err);
                if(err.code === 'permission-denied') setInitError("Zugriff verweigert (DB Regeln prüfen).");
                else setInitError("Verbindungsfehler: " + err.message);
                setLoading(false); 
            });
        };

        // --- TIMER LOGIC ---
        useEffect(() => {
            if (isRunning && timeLeft > 0) {
                timerRef.current = setInterval(() => setTimeLeft(t => t - 1), 1000);
            } else if (timeLeft === 0) {
                setIsRunning(false);
                if (!isBreak) {
                    setIsBreak(true); setTimeLeft(5*60);
                    if(activeTaskId) updatePomo(activeTaskId);
                    try {
                        const ctx = new (window.AudioContext||window.webkitAudioContext)();
                        const osc = ctx.createOscillator(); osc.connect(ctx.destination);
                        osc.start(); osc.stop(ctx.currentTime + 0.5);
                    } catch(e) {}
                } else {
                    setIsBreak(false); setTimeLeft(25*60);
                }
            }
            return () => clearInterval(timerRef.current);
        }, [isRunning, timeLeft]);

        // --- ACTIONS (Alle nutzen jetzt die globale Collection 'tasks') ---
        const addTask = async (e) => {
            e.preventDefault();
            if(!connected || !dbRef.current) { 
                alert("Bitte warten - Verbindung wird noch hergestellt..."); 
                return; 
            }
            if (!newTaskTitle.trim()) return;
            const { addDoc, collection, serverTimestamp } = window.Firebase;
            try {
                const newTask = {
                    title: newTaskTitle, 
                    urgent: isUrgent, 
                    important: isImportant,
                    completed: false, 
                    pomoEst: parseInt(pomoEst)||1, 
                    pomoDone: 0,
                    subtasks: [], 
                    createdAt: serverTimestamp()
                };
                console.log("Erstelle Task:", newTask);
                await addDoc(collection(dbRef.current, 'tasks'), newTask);
                setNewTaskTitle('');
            } catch(e) { 
                console.error("Task-Fehler:", e); 
                alert("Fehler beim Speichern: " + e.message); 
            }
        };

        const updatePomo = async (id) => {
            if (!connected || !dbRef.current) return;
            const task = tasks.find(t => t.id === id); 
            if(!task) return;
            const { updateDoc, doc } = window.Firebase;
            try {
                await updateDoc(doc(dbRef.current, 'tasks', id), { pomoDone: (task.pomoDone||0)+1 });
            } catch(e) {
                console.error("Pomo-Update Fehler:", e);
            }
        };

        const toggleComplete = async (task) => {
            if(!connected || !dbRef.current) return;
            const { updateDoc, doc } = window.Firebase;
            try {
                await updateDoc(doc(dbRef.current, 'tasks', task.id), { completed: !task.completed });
            } catch(e) {
                console.error("Toggle-Fehler:", e);
                alert("Fehler beim Aktualisieren: " + e.message);
            }
        };
        
        const deleteTask = async (id) => {
            if(!connected || !dbRef.current) return;
            const { deleteDoc, doc } = window.Firebase;
            try {
                await deleteDoc(doc(dbRef.current, 'tasks', id));
            } catch(e) {
                console.error("Lösch-Fehler:", e);
                alert("Fehler beim Löschen: " + e.message);
            }
        };

        const addSubtask = async (e) => {
            e.preventDefault();
            if(!activeTaskId || !newSubtaskTitle.trim() || !connected || !dbRef.current) return;
            const task = tasks.find(t => t.id === activeTaskId); if(!task) return;
            const newSub = { id: Date.now(), title: newSubtaskTitle, completed: false };
            const updatedSubtasks = [...(task.subtasks || []), newSub];
            const { updateDoc, doc } = window.Firebase;
            try {
                await updateDoc(doc(dbRef.current, 'tasks', activeTaskId), { subtasks: updatedSubtasks });
                setNewSubtaskTitle('');
            } catch(e) {
                console.error("Subtask-Fehler:", e);
                alert("Fehler beim Hinzufügen: " + e.message);
            }
        };

        const toggleSubtask = async (subtaskId) => {
            if(!activeTaskId || !connected || !dbRef.current) return;
            const task = tasks.find(t => t.id === activeTaskId); if(!task) return;
            const updatedSubtasks = (task.subtasks || []).map(s => s.id === subtaskId ? { ...s, completed: !s.completed } : s);
            const { updateDoc, doc } = window.Firebase;
            try {
                await updateDoc(doc(dbRef.current, 'tasks', activeTaskId), { subtasks: updatedSubtasks });
            } catch(e) {
                console.error("Subtask-Toggle Fehler:", e);
            }
        };

        const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

        // --- RENDER ---
        
        if (loading) return (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 flex-col gap-6 p-4 text-center">
                <div className="spinner"></div>
                
                <div className="space-y-2">
                    <p className="text-slate-500 text-sm animate-pulse font-medium">Lade Egonaut...</p>
                    
                    {slowLoading && (
                        <div className="bg-amber-50 border border-amber-200 p-3 rounded-lg text-left max-w-sm mx-auto shadow-sm animate-in fade-in duration-500">
                            <p className="text-xs text-amber-800">
                                <b>Verbindung dauert länger...</b><br/>
                                Falls Fehler auftreten: Blockiert ein AdBlocker die Datenbank?
                            </p>
                        </div>
                    )}

                    {initError && (
                        <div className="bg-red-50 border border-red-200 p-4 rounded text-red-700 max-w-md text-sm font-bold">
                           {initError}
                        </div>
                    )}
                </div>
            </div>
        );

        const q1 = tasks.filter(t => t.important && t.urgent && !t.completed);
        const q2 = tasks.filter(t => t.important && !t.urgent && !t.completed);
        const q3 = tasks.filter(t => !t.important && t.urgent && !t.completed);
        const q4 = tasks.filter(t => !t.important && !t.urgent && !t.completed);
        const activeTask = tasks.find(t => t.id === activeTaskId);

        return (
            <div className="min-h-screen text-slate-800 font-sans p-4 pb-20 md:pb-8">
                {/* Header */}
                <div className="max-w-6xl mx-auto mb-6 flex justify-between items-center">
                    <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight uppercase">EGONAUT</h1>
                    <div className="flex flex-col items-end">
                        <span className="text-[10px] md:text-xs text-green-600 bg-green-100 px-2 py-1 rounded-full border border-green-200 font-mono flex items-center gap-1 mb-1">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> ONLINE
                        </span>
                    </div>
                </div>

                {/* Input */}
                <form onSubmit={addTask} className="max-w-6xl mx-auto bg-white p-4 rounded-xl shadow-lg border border-slate-100 mb-8 flex flex-col md:flex-row gap-4">
                    <div className="flex-grow">
                        <label className="text-xs font-bold text-slate-400 uppercase">Aufgabe</label>
                        <input type="text" value={newTaskTitle} onChange={e=>setNewTaskTitle(e.target.value)} className="w-full text-lg border-b-2 border-slate-100 focus:border-indigo-500 outline-none py-1" placeholder="Was steht an?" />
                    </div>
                    <div className="flex gap-4 justify-between md:justify-start">
                        <Toggle label="Dringend?" active={isUrgent} onClick={()=>setIsUrgent(!isUrgent)} color="bg-red-500" />
                        <Toggle label="Wichtig?" active={isImportant} onClick={()=>setIsImportant(!isImportant)} color="bg-indigo-500" />
                        <div className="w-20">
                            <label className="text-xs font-bold text-slate-400 uppercase">Dauer</label>
                            <input type="number" min="1" max="8" value={pomoEst} onChange={e=>setPomoEst(e.target.value)} className="w-full bg-slate-50 rounded p-1 text-center" />
                        </div>
                    </div>
                    <button type="submit" className="bg-slate-900 text-white rounded-lg px-6 py-2 font-bold hover:bg-slate-700 transition-colors">Go</button>
                </form>

                {/* Matrix */}
                <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 md:h-[calc(100vh-250px)]">
                    <Quadrant title="Sofort (Q1)" tasks={q1} color="bg-red-50 border-red-100" icon={<Icons.AlertCircle className="text-red-400"/>} onCheck={toggleComplete} onDel={deleteTask} onPlay={t => {setActiveTaskId(t.id); setTimeLeft(25*60); setIsRunning(true); setIsBreak(false);}} />
                    <Quadrant title="Planen (Q2)" tasks={q2} color="bg-sky-50 border-sky-100" icon={<Icons.Clock className="text-sky-400"/>} onCheck={toggleComplete} onDel={deleteTask} onPlay={t => {setActiveTaskId(t.id); setTimeLeft(25*60); setIsRunning(true); setIsBreak(false);}} />
                    <Quadrant title="Delegieren (Q3)" tasks={q3} color="bg-amber-50 border-amber-100" icon={<Icons.RotateCcw className="text-amber-400"/>} onCheck={toggleComplete} onDel={deleteTask} onPlay={t => {setActiveTaskId(t.id); setTimeLeft(25*60); setIsRunning(true); setIsBreak(false);}} />
                    <Quadrant title="Papierkorb (Q4)" tasks={q4} color="bg-slate-100 border-slate-200" icon={<Icons.Trash2 className="text-slate-400"/>} onCheck={toggleComplete} onDel={deleteTask} onPlay={t => {setActiveTaskId(t.id); setTimeLeft(25*60); setIsRunning(true); setIsBreak(false);}} />
                </div>

                {/* Focus Overlay */}
                {activeTaskId && activeTask && (
                    <div className="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center text-white overflow-y-auto">
                        <div className={`w-full p-8 text-center ${isBreak ? 'bg-emerald-600' : 'bg-indigo-600'} transition-colors duration-500 shrink-0`}>
                            <h2 className="text-sm font-bold tracking-widest opacity-75">{isBreak ? 'PAUSE MACHEN' : 'FOKUS MODUS'}</h2>
                            <div className="text-7xl font-mono font-black my-6">{formatTime(timeLeft)}</div>
                            <div className="flex justify-center gap-6">
                                <button onClick={() => setIsRunning(!isRunning)} className="bg-white/20 p-4 rounded-full hover:bg-white/30 transition-colors">{isRunning ? <Icons.Pause /> : <Icons.Play />}</button>
                                <button onClick={() => {setIsRunning(false); setActiveTaskId(null);}} className="text-sm opacity-60 hover:opacity-100 mt-4 block">Beenden</button>
                            </div>
                        </div>
                        
                        <div className="p-8 text-center w-full max-w-2xl">
                            <h3 className="text-2xl font-bold mb-4">{activeTask.title}</h3>
                            <div className="flex justify-center gap-2 mb-8">
                                {Array.from({length: activeTask.pomoEst}).map((_,i) => (
                                    <div key={i} className={`w-4 h-4 rounded-full border-2 ${i<(activeTask.pomoDone||0)?'bg-indigo-500 border-indigo-500':'border-slate-600'}`} />
                                ))}
                            </div>
                            <div className="bg-slate-800 rounded-xl p-4 mb-8 text-left">
                                <h4 className="text-xs font-bold text-slate-500 uppercase mb-3">Teilaufgaben (Schritt für Schritt)</h4>
                                <div className="space-y-2 mb-4">
                                    {(activeTask.subtasks || []).map(sub => (
                                        <div key={sub.id} onClick={() => toggleSubtask(sub.id)} className="flex items-center gap-3 cursor-pointer group hover:bg-slate-700 p-2 rounded transition-colors">
                                            <div className={`w-5 h-5 rounded border-2 flex items-center justify-center ${sub.completed ? 'bg-green-500 border-green-500' : 'border-slate-500'}`}>
                                                {sub.completed && <Icons.Check width="14" />}
                                            </div>
                                            <span className={`${sub.completed ? 'line-through opacity-50' : 'opacity-90'}`}>{sub.title}</span>
                                        </div>
                                    ))}
                                    {(!activeTask.subtasks || activeTask.subtasks.length === 0) && <p className="text-slate-600 text-sm italic">Keine Teilaufgaben. Zerlege diesen Brocken!</p>}
                                </div>
                                <form onSubmit={addSubtask} className="flex gap-2">
                                    <input type="text" value={newSubtaskTitle} onChange={e => setNewSubtaskTitle(e.target.value)} placeholder="+ Neuer Teilschritt..." className="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm flex-grow outline-none focus:border-indigo-500 text-white" />
                                    <button type="submit" className="bg-slate-700 hover:bg-indigo-600 px-3 rounded text-white font-bold transition-colors"><Icons.Plus width="16"/></button>
                                </form>
                            </div>
                            <button onClick={() => {toggleComplete(activeTask); setActiveTaskId(null);}} className="bg-white text-slate-900 px-8 py-3 rounded-full font-bold flex items-center gap-2 mx-auto hover:bg-green-400 hover:text-white transition-colors">
                                <Icons.Check /> Aufgabe abschließen
                            </button>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const Toggle = ({label, active, onClick, color}) => (
        <div className="flex flex-col items-center cursor-pointer" onClick={onClick}>
            <span className="text-[10px] font-bold text-slate-400 uppercase mb-1">{label}</span>
            <div className={`w-10 h-6 rounded-full p-1 transition-colors ${active ? color : 'bg-slate-200'}`}>
                <div className={`w-4 h-4 bg-white rounded-full shadow transition-transform ${active ? 'translate-x-4' : ''}`} />
            </div>
        </div>
    );

    const Quadrant = ({title, tasks, color, icon, onCheck, onDel, onPlay}) => (
        <div className={`rounded-xl border flex flex-col h-full overflow-hidden ${color}`}>
            <div className="p-3 flex justify-between items-center bg-white/40 border-b border-inherit">
                <h3 className="font-bold text-sm uppercase opacity-70">{title}</h3>
                {icon}
            </div>
            <div className="flex-grow p-2 overflow-y-auto space-y-2 scrollbar-thin">
                {tasks.map(t => (
                    <div key={t.id} className="bg-white p-3 rounded-lg shadow-sm flex gap-3 group">
                        <button onClick={()=>onCheck(t)} className="w-5 h-5 mt-1 border-2 border-slate-200 rounded hover:border-green-500" />
                        <div className="flex-grow min-w-0">
                            <p className="font-medium text-slate-800 leading-tight">{t.title}</p>
                            <div className="flex gap-2 mt-1">
                                <p className="text-xs text-slate-400 flex items-center gap-1"><Icons.Clock width="10"/> {t.pomoDone||0} / {t.pomoEst}</p>
                                {t.subtasks && t.subtasks.length > 0 && (
                                    <p className="text-xs text-indigo-400 flex items-center gap-1">• {t.subtasks.filter(s=>s.completed).length}/{t.subtasks.length} Steps</p>
                                )}
                            </div>
                        </div>
                        <div className="flex flex-col gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onClick={()=>onPlay(t)} className="bg-indigo-50 text-indigo-600 p-1.5 rounded"><Icons.Play width="14" height="14"/></button>
                            <button onClick={()=>onDel(t.id)} className="text-slate-300 hover:text-red-500 p-1.5"><Icons.Trash2 width="14" height="14"/></button>
                        </div>
                    </div>
                ))}
                {tasks.length===0 && <div className="text-center opacity-30 text-xs italic mt-4">Leer</div>}
            </div>
        </div>
    );

    try {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    } catch (e) {
        document.getElementById('root').innerHTML = '<div style="color:red; padding: 20px;"><h1>Start-Fehler</h1><p>'+e.message+'</p></div>';
    }
</script>
</body>
</html>
